[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "whats-priced-in"
version = "0.1.0"
description = "Price in, implied bet out. Reverse DCF and implied-expectations tools for equities."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Manoj" }]
keywords = [
    "dcf",
    "reverse-dcf",
    "valuation",
    "implied-growth",
    "equities",
    "fcfe",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial",
]
dependencies = [
    "PyYAML>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
wpi = "whats_priced_in.cli:main"
whats-priced-in = "whats_priced_in.cli:main"

[project.urls]
Homepage = "https://x.com/miyer83"

[tool.setuptools.packages.find]
include = ["whats_priced_in*"]

[tool.setuptools.package-data]
whats_priced_in = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
